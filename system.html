<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MachacekART | Interní systém</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .modal { transition: opacity 0.25s ease; }
        body.modal-active { overflow-x: hidden; overflow-y: hidden !important; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 h-screen flex flex-col">

    <!-- HLAVIČKA -->
    <header class="bg-gray-900 text-white p-4 shadow-md flex justify-between items-center">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-emerald-600 rounded flex items-center justify-center font-black text-xl" style="clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);">
                M
            </div>
            <h1 class="text-xl font-bold">MachacekART <span class="text-gray-400 text-sm font-normal">| Výrobní systém</span></h1>
        </div>
        <button onclick="otevritModal()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded font-bold shadow transition">
            + Nová zakázka
        </button>
    </header>

    <!-- OBSAH -->
    <main class="flex-1 overflow-auto p-6 max-w-6xl mx-auto w-full">
        
        <div class="flex justify-between items-end mb-6">
            <h2 class="text-2xl font-bold">Aktivní zakázky</h2>
        </div>

        <!-- VÝPIS ZAKÁZEK -->
        <div id="seznam-zakazek" class="grid grid-cols-1 gap-4">
            <p class="text-gray-500">Načítám data z dílny...</p>
        </div>

    </main>

    <!-- MODÁLNÍ OKNO PRO PŘIDÁNÍ / ÚPRAVU ZAKÁZKY -->
    <div id="modal-zakazka" class="modal opacity-0 pointer-events-none fixed w-full h-full top-0 left-0 flex items-center justify-center z-50">
        <div class="absolute w-full h-full bg-gray-900 opacity-50" onclick="zavritModal()"></div>
        
        <div class="bg-white w-full max-w-2xl mx-auto rounded-xl shadow-2xl z-50 overflow-y-auto max-h-[90vh]">
            <div class="py-4 text-left px-6 border-b flex justify-between items-center">
                <h2 class="text-2xl font-bold text-gray-800" id="modal-titulek">Nová zakázka</h2>
                <button class="text-gray-600 hover:text-black font-bold text-2xl" onclick="zavritModal()">&times;</button>
            </div>
            
            <form id="form-zakazka" class="p-6">
                <!-- Skryté ID pro editaci -->
                <input type="hidden" id="z-id">

                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-sm font-bold mb-1">Zákazník (Název firmy / Jméno)</label>
                        <input type="text" id="z-zakaznik" class="w-full border-2 border-gray-200 p-2 rounded focus:border-emerald-500 outline-none" required>
                    </div>
                    <div>
                        <label class="block text-sm font-bold mb-1 text-red-600">Termín dodání (Do kdy)</label>
                        <input type="date" id="z-termin" class="w-full border-2 border-red-200 bg-red-50 p-2 rounded focus:border-red-500 outline-none" required>
                    </div>
                </div>

                <div class="mb-6">
                    <label class="block text-sm font-bold mb-1">Stav zakázky</label>
                    <select id="z-stav" class="w-full border-2 border-gray-200 p-2 rounded outline-none">
                        <option value="Přijato">Přijato (Čeká na zpracování)</option>
                        <option value="Tiskne se">Tiskne se / Ve výrobě</option>
                        <option value="Hotovo">Hotovo (K předání)</option>
                    </select>
                </div>

                <!-- SEKCE POLOŽEK -->
                <div class="bg-gray-50 p-4 rounded-lg border border-gray-200 mb-6">
                    <h3 class="font-bold mb-3 border-b pb-2">Položky zakázky</h3>
                    
                    <div id="vypis-polozek" class="mb-3 space-y-2">
                        <!-- Položky se vypíší přes JS -->
                    </div>

                    <div class="flex gap-2 items-end">
                        <div class="flex-1">
                            <label class="text-xs text-gray-500">Název (např. Podtácek)</label>
                            <input type="text" id="p-nazev" class="w-full border p-2 rounded">
                        </div>
                        <div class="w-20">
                            <label class="text-xs text-gray-500">Ks</label>
                            <input type="number" id="p-ks" value="1" min="1" class="w-full border p-2 rounded">
                        </div>
                        <div class="w-24">
                            <label class="text-xs text-gray-500">Cena/ks</label>
                            <input type="number" id="p-cena" value="0" min="0" class="w-full border p-2 rounded">
                        </div>
                        <button type="button" onclick="pridatPolozku()" class="bg-gray-800 hover:bg-black text-white px-4 py-2 rounded font-bold h-[42px]">+</button>
                    </div>
                </div>

                <div class="flex justify-between items-center mb-6">
                    <span class="text-gray-600">Celková cena:</span>
                    <span class="text-2xl font-black text-emerald-600" id="z-celkova-cena">0 Kč</span>
                </div>

                <div class="flex justify-end gap-3 pt-4 border-t">
                    <button type="button" onclick="zavritModal()" class="px-4 py-2 bg-gray-200 text-gray-800 font-bold rounded hover:bg-gray-300">Zrušit</button>
                    <button type="submit" class="px-6 py-2 bg-emerald-600 text-white font-bold rounded shadow hover:bg-emerald-700">Uložit zakázku</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, updateDoc, doc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyCGMPmV6UI1Q-T5VCHFkv_Qbp3_6d8HoGQ", 
            authDomain: "dilna-web.firebaseapp.com", 
            projectId: "dilna-web", 
            storageBucket: "dilna-web.firebasestorage.app", 
            messagingSenderId: "579413031750", 
            appId: "1:579413031750:web:de8e579a13b3f483134347", 
            measurementId: "G-6T0Q7909D2" 
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Globální proměnné pro editaci
        window.pracovniPolozky = [];
        window.vsechnyZakazky = {};

        // --- 1. VYKRESLENÍ ZAKÁZEK Z FIREBASE ---
        onSnapshot(collection(db, "zakazky"), (snapshot) => {
            const kontejner = document.getElementById('seznam-zakazek');
            kontejner.innerHTML = '';
            window.vsechnyZakazky = {};

            if (snapshot.empty) {
                kontejner.innerHTML = '<p class="text-gray-500">Zatím tu nejsou žádné zakázky.</p>';
                return;
            }

            snapshot.forEach(docSnap => {
                const z = docSnap.data();
                const id = docSnap.id;
                window.vsechnyZakazky[id] = z; // Uložíme si do paměti pro editaci

                // Barvy štítků podle stavu
                let barvaStavu = 'bg-gray-200 text-gray-800';
                if(z.stav === 'Tiskne se') barvaStavu = 'bg-blue-100 text-blue-800 border border-blue-200';
                if(z.stav === 'Hotovo') barvaStavu = 'bg-green-100 text-green-800 border border-green-200';

                // Formátování data (zobrazit hezky)
                let zobrazenyTermin = "Neurčeno";
                if(z.termin) {
                    const d = new Date(z.termin);
                    zobrazenyTermin = `${d.getDate()}.${d.getMonth() + 1}.${d.getFullYear()}`;
                }

                // Generování výpisu položek
                let htmlPolozky = '';
                let skutecnaCena = 0;
                if(z.obsah && z.obsah.length > 0) {
                    z.obsah.forEach(p => {
                        const cenaPolozky = p.cena ? (p.cena * p.ks) : 0;
                        skutecnaCena += cenaPolozky;
                        htmlPolozky += `<div class="flex justify-between text-sm py-1 border-b border-gray-100 last:border-0">
                            <span>${p.ks}x ${p.nazev}</span>
                            <span class="text-gray-500">${cenaPolozky} Kč</span>
                        </div>`;
                    });
                }
                
                // Záchrana ceny pro staré zakázky (z webu), které neměly cenu u položek
                const cenaKVypsani = skutecnaCena > 0 ? skutecnaCena : (z.cena || 0);

                kontejner.innerHTML += `
                    <div class="bg-white p-5 rounded-xl shadow border border-gray-200 flex flex-col md:flex-row justify-between gap-4">
                        <div class="flex-1">
                            <div class="flex items-center gap-3 mb-2">
                                <h3 class="text-lg font-bold">${z.zakaznik}</h3>
                                <span class="px-2 py-1 rounded text-xs font-bold ${barvaStavu}">${z.stav}</span>
                            </div>
                            
                            <div class="text-sm font-medium text-red-600 mb-3 flex items-center gap-1">
                                ⏳ Termín: ${zobrazenyTermin}
                            </div>
                            
                            <div class="bg-gray-50 p-3 rounded border border-gray-100">
                                ${htmlPolozky || '<span class="text-sm text-gray-400">Žádné položky</span>'}
                            </div>
                        </div>
                        
                        <div class="flex flex-col justify-between items-end min-w-[150px]">
                            <div class="text-right">
                                <span class="block text-xs text-gray-500 uppercase font-bold tracking-wider">Cena celkem</span>
                                <span class="text-2xl font-black text-emerald-600">${cenaKVypsani} Kč</span>
                            </div>
                            <div class="flex gap-2 mt-4">
                                <button onclick="otevritModal('${id}')" class="text-sm px-3 py-1 bg-gray-100 hover:bg-gray-200 font-medium rounded text-gray-700 transition">Upravit</button>
                                <button onclick="smazatZakazku('${id}')" class="text-sm px-3 py-1 bg-red-50 hover:bg-red-100 text-red-600 font-medium rounded transition">Smazat</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        });

        // --- 2. LOGIKA MODÁLNÍHO OKNA A POLOŽEK ---
        window.otevritModal = function(id = null) {
            document.getElementById('modal-zakazka').classList.remove('opacity-0', 'pointer-events-none');
            document.body.classList.add('modal-active');
            
            // Vyresetovat formulář
            document.getElementById('form-zakazka').reset();
            window.pracovniPolozky = [];
            
            if(id && window.vsechnyZakazky[id]) {
                // ÚPRAVA EXISTUJÍCÍ ZAKÁZKY
                const z = window.vsechnyZakazky[id];
                document.getElementById('modal-titulek').innerText = 'Upravit zakázku';
                document.getElementById('z-id').value = id;
                document.getElementById('z-zakaznik').value = z.zakaznik;
                document.getElementById('z-termin').value = z.termin || '';
                document.getElementById('z-stav').value = z.stav || 'Přijato';
                
                if(z.obsah) window.pracovniPolozky = [...z.obsah];
            } else {
                // NOVÁ ZAKÁZKA
                document.getElementById('modal-titulek').innerText = 'Nová zakázka';
                document.getElementById('z-id').value = '';
                // Předvyplnit dnešní datum + 7 dní
                const zaTyden = new Date();
                zaTyden.setDate(zaTyden.getDate() + 7);
                document.getElementById('z-termin').value = zaTyden.toISOString().split('T')[0];
            }
            
            prekreslitPracovniPolozky();
        }

        window.zavritModal = function() {
            document.getElementById('modal-zakazka').classList.add('opacity-0', 'pointer-events-none');
            document.body.classList.remove('modal-active');
        }

        window.pridatPolozku = function() {
            const nazev = document.getElementById('p-nazev').value;
            const ks = parseInt(document.getElementById('p-ks').value) || 1;
            const cena = parseInt(document.getElementById('p-cena').value) || 0;
            
            if(!nazev) { alert('Zadejte název položky'); return; }

            window.pracovniPolozky.push({
                nazev: nazev,
                ks: ks,
                cena: cena,
                stavItem: 'Čeká'
            });

            document.getElementById('p-nazev').value = '';
            document.getElementById('p-ks').value = '1';
            document.getElementById('p-cena').value = '0';
            
            prekreslitPracovniPolozky();
        }

        window.odebratPolozku = function(index) {
            window.pracovniPolozky.splice(index, 1);
            prekreslitPracovniPolozky();
        }

        function prekreslitPracovniPolozky() {
            const box = document.getElementById('vypis-polozek');
            box.innerHTML = '';
            let celkem = 0;

            if(window.pracovniPolozky.length === 0) {
                box.innerHTML = '<div class="text-sm text-gray-500 italic">Zatím nepřidány žádné položky.</div>';
            } else {
                window.pracovniPolozky.forEach((p, index) => {
                    const cenaSpolu = p.ks * (p.cena || 0);
                    celkem += cenaSpolu;
                    box.innerHTML += `
                        <div class="flex justify-between items-center bg-white p-2 rounded border border-gray-200 text-sm">
                            <div><strong>${p.ks}x</strong> ${p.nazev}</div>
                            <div class="flex items-center gap-3">
                                <span>${cenaSpolu} Kč</span>
                                <button type="button" onclick="odebratPolozku(${index})" class="text-red-500 hover:text-red-700 font-bold">&times;</button>
                            </div>
                        </div>
                    `;
                });
            }
            document.getElementById('z-celkova-cena').innerText = celkem + ' Kč';
        }

        // --- 3. ULOŽENÍ / ÚPRAVA DO FIREBASE ---
        document.getElementById('form-zakazka').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('z-id').value;
            
            let celkovaCena = 0;
            window.pracovniPolozky.forEach(p => { celkovaCena += (p.ks * (p.cena || 0)); });

            const dataZakazky = {
                zakaznik: document.getElementById('z-zakaznik').value,
                termin: document.getElementById('z-termin').value,
                stav: document.getElementById('z-stav').value,
                obsah: window.pracovniPolozky,
                cena: celkovaCena
            };

            try {
                if(id) {
                    // Updatujeme existující
                    await updateDoc(doc(db, "zakazky", id), dataZakazky);
                } else {
                    // Vytváříme novou
                    await addDoc(collection(db, "zakazky"), dataZakazky);
                }
                zavritModal();
            } catch(err) {
                alert("Chyba při ukládání: " + err.message);
            }
        });

        // --- 4. SMAZÁNÍ ZAKÁZKY ---
        window.smazatZakazku = async function(id) {
            if(confirm('Opravdu chcete tuto zakázku smazat? Tento krok nelze vrátit.')) {
                await deleteDoc(doc(db, "zakazky", id));
            }
        }

    </script>
</body>
</html>
